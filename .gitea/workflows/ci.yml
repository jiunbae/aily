name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          npm ci

      - name: Verify
        run: |
          pytest tests/ -v
          python -m compileall -q agent-bridge.py slack-bridge.py bridge_core.py multiplexer.py session_limit.py dashboard
          bash -n aily install.sh docker-entrypoint.sh hooks/*.sh
          npm run build:css
          git diff --exit-code -- dashboard/static/css/tailwind.css
          npm pack --dry-run

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build image
        run: docker build --tag aily-ci .
