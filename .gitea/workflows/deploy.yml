name: Build and Deploy

concurrency:
  group: deploy-${{ gitea.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'agent-bridge.py'
      - 'slack-bridge.py'
      - 'bridge_core.py'
      - 'multiplexer.py'
      - 'session_limit.py'
      - 'dashboard/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.gitea/workflows/**'
  workflow_dispatch:

env:
  REGISTRY: registry.jiun.dev
  IMAGE_NAME: aily
  IAC_REPO: jiunbae/IaC
  IAC_BRANCH: release
  APP_PATH: kubernetes/apps/aily

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # TODO: pin to commit SHA

      - uses: actions/setup-python@v5  # TODO: pin to commit SHA
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4  # TODO: pin to commit SHA

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # TODO: pin to commit SHA

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to commit SHA

      - name: Log in to Docker Registry
        uses: docker/login-action@v3  # TODO: pin to commit SHA
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6  # TODO: pin to commit SHA
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ gitea.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Configure git credentials for IaC repo
        env:
          IAC_TOKEN: ${{ secrets.IAC_GITHUB_TOKEN }}
        run: |
          # Provide the token via GIT_ASKPASS instead of embedding it in the
          # clone URL. Embedding it there leaks the secret into the runner's
          # process args and persists it in iac/.git/config for the later push.
          cat > "${RUNNER_TEMP:-/tmp}/git-askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            Username*) printf 'x-access-token' ;;
            Password*) printf '%s' "$IAC_TOKEN" ;;
          esac
          EOF
          chmod 700 "${RUNNER_TEMP:-/tmp}/git-askpass.sh"

      - name: Clone IaC repo from GitHub
        env:
          IAC_TOKEN: ${{ secrets.IAC_GITHUB_TOKEN }}
          GIT_ASKPASS: ${{ runner.temp }}/git-askpass.sh
        run: |
          git clone -b "${IAC_BRANCH}" "https://github.com/${IAC_REPO}.git" iac

      - name: Update image tag in IaC repo
        run: |
          cd iac/${{ env.APP_PATH }}
          sed -i "s/newTag: .*/newTag: ${{ gitea.sha }}/" kustomization.yaml
          cat kustomization.yaml

      - name: Commit and push to IaC repo
        env:
          IAC_TOKEN: ${{ secrets.IAC_GITHUB_TOKEN }}
          GIT_ASKPASS: ${{ runner.temp }}/git-askpass.sh
        run: |
          cd iac
          git config user.name "Gitea Actions"
          git config user.email "actions@gitea.jiun.dev"
          git add ${{ env.APP_PATH }}/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(aily): update image tag to ${{ gitea.sha }}"
          git push
